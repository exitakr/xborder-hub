<!DOCTYPE html>
<html lang="ja" style="color-scheme: light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF6E8">
<title>X Border Hub — ログイン</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="noise">

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-cream/85 backdrop-blur-md border-b border-ink/10">
  <div class="container-app py-3.5 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="logo-mark">×</div>
      <div>
        <div class="display font-bold text-[15px] leading-none tracking-tight text-ink">X Border Hub</div>
        <div class="text-[9px] uppercase tracking-[0.22em] text-ink-faint mt-0.5">crossing borders</div>
      </div>
    </a>
    <a href="index.html" class="text-[12px] font-bold text-ink-soft">← ホームへ</a>
  </div>
</header>

<main class="relative z-10 py-10 lg:py-20">
  <div class="container-app">
    <div class="max-w-md mx-auto">
      <!-- Toggle: Login / Signup -->
      <div class="flex justify-center mb-6">
        <div class="inline-flex p-1 bg-paper border-[1.5px] border-ink rounded-xl shadow-pop-sm">
          <button id="tab-login" class="tab-auth active px-5 py-2 rounded-lg text-[13px] font-bold">ログイン</button>
          <button id="tab-signup" class="tab-auth px-5 py-2 rounded-lg text-[13px] font-bold text-ink-soft">新規登録</button>
        </div>
      </div>

      <div class="auth-card rise">
        <div id="login-form">
          <div class="text-center mb-6">
            <h1 class="display font-bold text-[26px] leading-tight text-ink">
              おかえりなさい
            </h1>
            <p class="text-[13px] text-ink-soft mt-2">
              アカウントにログインして、続きから始める
            </p>
          </div>

          <!-- OAuth -->
          <div class="space-y-2.5 mb-5">
            <button class="btn-oauth" onclick="oauthLogin('google')">
              <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.3-7.2 2.3-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2c-.4.4 6.7-4.9 6.7-14.9 0-1.3-.1-2.6-.4-3.9z"/>
              </svg>
              <span>Googleで続ける</span>
            </button>

            <button class="btn-oauth" style="background:#1877F2; color:#FFF; border-color:#0A1F3D;" onclick="oauthLogin('facebook')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebookで続ける</span>
            </button>
          </div>

          <!-- Divider -->
          <div class="divider-dot text-[11px] font-bold uppercase tracking-wider my-5">または</div>

          <!-- Email login -->
          <form onsubmit="emailLogin(event)">
            <div class="mb-4">
              <label class="label">メールアドレス</label>
              <input type="email" class="field" placeholder="you@example.com" required>
            </div>
            <div class="mb-2">
              <label class="label">パスワード</label>
              <input type="password" class="field" placeholder="••••••••" required>
            </div>
            <div class="text-right mb-5">
              <a href="#" class="text-[11px] text-blue font-bold">パスワードを忘れた?</a>
            </div>
            <button type="submit" class="btn-primary w-full">
              ログイン
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </button>
          </form>

          <p class="text-center text-[12px] text-ink-soft mt-5">
            アカウントをお持ちでない方は
            <button class="text-blue font-bold" onclick="switchTab('signup')">新規登録</button>
          </p>
        </div>

        <div id="signup-form" class="hidden">
          <div class="text-center mb-6">
            <h1 class="display font-bold text-[26px] leading-tight text-ink">
              はじめまして
            </h1>
            <p class="text-[13px] text-ink-soft mt-2">
              先に行った人と繋がる、最初の一歩
            </p>
          </div>

          <div class="space-y-2.5 mb-5">
            <button class="btn-oauth" onclick="oauthLogin('google')">
              <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.3-7.2 2.3-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2c-.4.4 6.7-4.9 6.7-14.9 0-1.3-.1-2.6-.4-3.9z"/>
              </svg>
              <span>Googleで登録</span>
            </button>

            <button class="btn-oauth" style="background:#1877F2; color:#FFF; border-color:#0A1F3D;" onclick="oauthLogin('facebook')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebookで登録</span>
            </button>
          </div>

          <div class="divider-dot text-[11px] font-bold uppercase tracking-wider my-5">または</div>

          <form onsubmit="emailSignup(event)">
            <div class="mb-4">
              <label class="label">表示名</label>
              <input type="text" class="field" placeholder="例: YT" required>
            </div>
            <div class="mb-4">
              <label class="label">メールアドレス</label>
              <input type="email" class="field" placeholder="you@example.com" required>
            </div>
            <div class="mb-5">
              <label class="label">パスワード</label>
              <input type="password" class="field" placeholder="8文字以上" minlength="8" required>
            </div>
            <label class="flex items-start gap-2 mb-5">
              <input type="checkbox" required class="mt-1">
              <span class="text-[11px] text-ink-soft leading-relaxed">
                <a href="#" class="text-blue font-bold underline">利用規約</a>と
                <a href="#" class="text-blue font-bold underline">プライバシーポリシー</a>に同意します
              </span>
            </label>
            <button type="submit" class="btn-primary w-full">
              アカウントを作成
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </button>
          </form>

          <p class="text-center text-[12px] text-ink-soft mt-5">
            既にアカウントをお持ちの方は
            <button class="text-blue font-bold" onclick="switchTab('login')">ログイン</button>
          </p>
        </div>
      </div>

      <p class="text-center text-[11px] text-ink-faint mt-6">
        ログインすることで、安全に経験を共有できます。
      </p>
    </div>
  </div>
</main>

<script>
  function switchTab(tab) {
    const loginTab = document.getElementById('tab-login');
    const signupTab = document.getElementById('tab-signup');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    if (tab === 'signup') {
      loginTab.classList.remove('active'); loginTab.classList.add('text-ink-soft');
      signupTab.classList.add('active'); signupTab.classList.remove('text-ink-soft');
      loginForm.classList.add('hidden');
      signupForm.classList.remove('hidden');
    } else {
      signupTab.classList.remove('active'); signupTab.classList.add('text-ink-soft');
      loginTab.classList.add('active'); loginTab.classList.remove('text-ink-soft');
      signupForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    }
  }
  document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
  document.getElementById('tab-signup').addEventListener('click', () => switchTab('signup'));

  function oauthLogin(provider) {
    localStorage.setItem('xbh_authed', '1');
    localStorage.setItem('xbh_provider', provider);
    window.location.href = 'mypage.html';
  }
  function emailLogin(e) {
    e.preventDefault();
    localStorage.setItem('xbh_authed', '1');
    window.location.href = 'mypage.html';
  }
  function emailSignup(e) {
    e.preventDefault();
    localStorage.setItem('xbh_authed', '1');
    window.location.href = 'mypage.html';
  }

  // Tab style
  document.querySelectorAll('.tab-auth').forEach(b => {
    b.classList.add('text-ink-soft');
  });
  document.getElementById('tab-login').classList.remove('text-ink-soft');
  const styleTab = document.createElement('style');
  styleTab.textContent = `.tab-auth.active { background: #0A1F3D; color: #FFF6E8 !important; }`;
  document.head.appendChild(styleTab);
</script>

</body>
</html>
