<!DOCTYPE html>
<html lang="ja" style="color-scheme: light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF6E8">
<title>X Border Hub — 新しいスレッド</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">

<style>
  .compose-shell {
    min-height: calc(100dvh - 64px);
    display: flex;
    flex-direction: column;
  }
  .compose-title {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Bricolage Grotesque', 'Zen Kaku Gothic New', sans-serif;
    font-weight: 800;
    color: #0A1F3D;
    line-height: 1.2;
    padding: 0;
    resize: none;
  }
  .compose-title::placeholder { color: #7C8597; font-weight: 700; }
  .compose-body {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Manrope', 'Zen Kaku Gothic New', sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #0A1F3D;
    line-height: 1.7;
    padding: 0;
    resize: none;
    min-height: 200px;
    flex: 1;
  }
  .compose-body::placeholder { color: #7C8597; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-cream border-b-[1.5px] border-ink">
  <div class="container-app py-2.5 flex items-center justify-between gap-3">
    <a href="threads.html" class="w-9 h-9 rounded-full bg-cream border-[1.5px] border-ink/15 flex items-center justify-center text-ink flex-shrink-0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </a>
    <div class="text-center flex-1 min-w-0">
      <div class="display font-bold text-[14px] tracking-tight text-ink">新しいスレッド</div>
      <div class="text-[9px] uppercase tracking-[0.22em] text-ink-faint mt-0.5" id="step-indicator">STEP 1 / 3</div>
    </div>
    <button id="submit-btn" disabled class="px-4 py-2 bg-ink/20 text-ink/40 rounded-full font-bold text-[12px] flex-shrink-0 transition-all">
      投稿
    </button>
  </div>
</header>

<main class="container-app pt-5 pb-32 lg:pb-20">
  <div class="max-w-2xl mx-auto compose-shell">

    <!-- Category selection -->
    <section class="mb-6">
      <p class="text-[10px] uppercase tracking-[0.24em] text-ink-faint font-bold mb-3">カテゴリ <span class="text-blue">*</span></p>
      <div class="flex flex-wrap gap-2">
        <button data-cat="career" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">💼 キャリア</button>
        <button data-cat="life" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">🏠 生活</button>
        <button data-cat="visa" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">🛂 ビザ</button>
        <button data-cat="salary" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">💰 給与</button>
        <button data-cat="family" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">👨‍👩‍👧 家族</button>
        <button data-cat="other" class="cat-btn px-3 py-2 bg-cream border-[1.5px] border-ink rounded-full text-[12px] font-bold shadow-pop-sm text-ink">💬 その他</button>
      </div>
    </section>

    <div class="h-px bg-ink/10 my-6"></div>

    <!-- Title -->
    <section class="mb-6">
      <p class="text-[10px] uppercase tracking-[0.24em] text-ink-faint font-bold mb-2">タイトル <span class="text-blue">*</span></p>
      <textarea id="title-input" class="compose-title" rows="2" placeholder="質問・話題を一文で..." maxlength="80" style="font-size:22px;"></textarea>
      <div class="flex items-center justify-between mt-1">
        <p class="text-[10px] text-ink-faint">具体的に書くと回答が集まりやすい</p>
        <p class="text-[10px] text-ink-faint"><span id="title-count">0</span> / 80</p>
      </div>
    </section>

    <div class="h-px bg-ink/10 my-6"></div>

    <!-- Body -->
    <section class="mb-6 flex-1">
      <p class="text-[10px] uppercase tracking-[0.24em] text-ink-faint font-bold mb-2">内容 <span class="text-blue">*</span></p>
      <textarea id="body-input" class="compose-body" placeholder="状況、聞きたいこと、相談したいことを自由に書いてください。匿名で投稿されます。" maxlength="2000"></textarea>
      <div class="flex items-center justify-end mt-2">
        <p class="text-[10px] text-ink-faint"><span id="body-count">0</span> / 2000</p>
      </div>
    </section>

    <!-- Tips -->
    <section class="mt-6">
      <div class="bg-paper border-[1.5px] border-ink rounded-2xl p-4">
        <p class="text-[12px] font-bold text-ink mb-2">📌 投稿のヒント</p>
        <ul class="text-[11px] text-ink-soft space-y-1 pl-4 list-disc leading-relaxed">
          <li>個人情報・会社の機密は書かないでください</li>
          <li>具体的な状況・国・時期を書くと回答が集まりやすい</li>
          <li>誹謗中傷・差別的な内容は禁止です</li>
          <li>匿名で投稿されます(自分の名前は表示されません)</li>
        </ul>
      </div>
    </section>

  </div>
</main>

<!-- Sticky bottom action bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-cream border-t-[1.5px] border-ink">
  <div class="container-app py-3 flex items-center justify-between gap-3">
    <a href="threads.html" class="px-4 py-2.5 text-[12px] font-bold text-ink-soft">
      キャンセル
    </a>
    <button id="submit-btn-bottom" disabled class="flex-1 max-w-xs btn-primary opacity-40 cursor-not-allowed">
      投稿する
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>

<script>
  let pickedCat = null;
  const titleInput = document.getElementById('title-input');
  const bodyInput = document.getElementById('body-input');
  const titleCount = document.getElementById('title-count');
  const bodyCount = document.getElementById('body-count');
  const submitBtn = document.getElementById('submit-btn');
  const submitBtnBottom = document.getElementById('submit-btn-bottom');
  const stepIndicator = document.getElementById('step-indicator');

  // Category buttons
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(c => {
        c.style.background = '';
        c.style.color = '';
      });
      b.style.background = '#0A1F3D';
      b.style.color = '#FFF6E8';
      pickedCat = b.dataset.cat;
      checkValid();
    });
  });

  // Auto-resize title
  titleInput.addEventListener('input', () => {
    titleCount.textContent = titleInput.value.length;
    titleInput.style.height = 'auto';
    titleInput.style.height = titleInput.scrollHeight + 'px';
    checkValid();
  });

  bodyInput.addEventListener('input', () => {
    bodyCount.textContent = bodyInput.value.length;
    checkValid();
  });

  function checkValid() {
    const valid = pickedCat && titleInput.value.trim().length >= 5 && bodyInput.value.trim().length >= 10;

    // Step indicator
    let step = 1;
    if (pickedCat) step = 2;
    if (pickedCat && titleInput.value.trim().length >= 5) step = 3;
    if (valid) step = 3;
    stepIndicator.textContent = `STEP ${step} / 3`;

    if (valid) {
      submitBtn.disabled = false;
      submitBtn.classList.remove('bg-ink/20', 'text-ink/40');
      submitBtn.classList.add('bg-blue', 'text-cream');
      submitBtnBottom.disabled = false;
      submitBtnBottom.classList.remove('opacity-40', 'cursor-not-allowed');
    } else {
      submitBtn.disabled = true;
      submitBtn.classList.add('bg-ink/20', 'text-ink/40');
      submitBtn.classList.remove('bg-blue', 'text-cream');
      submitBtnBottom.disabled = true;
      submitBtnBottom.classList.add('opacity-40', 'cursor-not-allowed');
    }
  }

  function submitPost() {
    if (!pickedCat || titleInput.value.trim().length < 5 || bodyInput.value.trim().length < 10) return;
    // Demo: simulate post then go back to threads
    alert('投稿しました!(デモ版)\nスレッド一覧に戻ります');
    window.location.href = 'threads.html';
  }

  submitBtn.addEventListener('click', submitPost);
  submitBtnBottom.addEventListener('click', submitPost);
</script>

</body>
</html>
